name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # соответствует engines.node: ^22.18 || ^24.11 || >=26
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Contrast (WCAG AA)
        run: npm run contrast

      - name: Build example.md
        run: npm run build

      # export прогоняет каждый слайд через headless-chromium — проверяет,
      # что все layouts реально рендерятся, а не только собирается Vite-бандл
      - name: Install Chromium for export
        run: npx playwright install --with-deps chromium

      - name: Export example.md (render smoke)
        run: npm run export
