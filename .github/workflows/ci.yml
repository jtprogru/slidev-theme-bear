name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Тег релиза дважды разъезжался с репозиторием: version в package.json
  # застревал на прошлом номере, а v0.1.0 остался на коммите, выпавшем из
  # истории после rebase. Обе проверки дешёвые и ловят это до того, как тег
  # станет чьей-то ссылкой.
  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # нужна история, иначе не проверить достижимость из main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::тег $GITHUB_REF_NAME, а version в package.json — $pkg"
            echo "бамп версии должен ехать тем же коммитом, который тегается"
            exit 1
          fi
          echo "$GITHUB_REF_NAME == $pkg"

      # Требует, чтобы ветка уезжала раньше тега: git push origin main,
      # затем git push origin vX.Y.Z. В обратном порядке проверка упадёт
      # честно — тега на origin ещё нет в истории main.
      - name: Tag is reachable from main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME не предок origin/main"
            echo "похоже на тег, оставшийся на переписанном коммите после rebase"
            exit 1
          fi
          echo "$GITHUB_REF_NAME достижим из main"

  check:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # соответствует engines.node: ^22.18 || ^24.11 || >=26
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci прогоняет prepare → scripts/sync-brand.mjs, который
      # перезаписывает public/brand/ и components/brandAssets.ts из
      # @jtprogru/mishka-ds. Если после этого дерево грязное — закоммиченная
      # айдентика отстала от дизайн-системы. Чинится `npm run brand:sync`.
      - name: Brand assets in sync with mishka-ds
        run: git diff --exit-code -- public/brand components/brandAssets.ts

      - name: Lint
        run: npm run lint

      - name: Contrast (WCAG AA)
        run: npm run contrast

      - name: Build example.md
        run: npm run build

      # export прогоняет каждый слайд через headless-chromium — проверяет,
      # что все layouts реально рендерятся, а не только собирается Vite-бандл
      - name: Install Chromium for export
        run: npx playwright install --with-deps chromium

      - name: Export example.md (render smoke)
        run: npm run export
