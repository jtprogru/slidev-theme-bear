name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # соответствует engines.node: ^22.18 || ^24.11 || >=26
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci прогоняет prepare → scripts/sync-brand.mjs, который
      # перезаписывает public/brand/ и components/brandAssets.ts из
      # @jtprogru/mishka-ds. Если после этого дерево грязное — закоммиченная
      # айдентика отстала от дизайн-системы. Чинится `npm run brand:sync`.
      - name: Brand assets in sync with mishka-ds
        run: git diff --exit-code -- public/brand components/brandAssets.ts

      - name: Lint
        run: npm run lint

      - name: Contrast (WCAG AA)
        run: npm run contrast

      - name: Build example.md
        run: npm run build

      # export прогоняет каждый слайд через headless-chromium — проверяет,
      # что все layouts реально рендерятся, а не только собирается Vite-бандл
      - name: Install Chromium for export
        run: npx playwright install --with-deps chromium

      - name: Export example.md (render smoke)
        run: npm run export
